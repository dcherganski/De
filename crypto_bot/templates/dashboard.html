<title>Крипто прогнозен бот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #eaeef3;
    --ink: #111521;
    --ink-2: #485065;
    --ink-3: #6d7589;
    --rule: #d9dee7;
    --grid: #e5e9ef;
    --accent: #d98a14;
    --accent-ink: #8a5300;
    --fan-95: rgba(217, 138, 20, 0.16);
    --fan-68: rgba(217, 138, 20, 0.34);
    --series-1: #2a78d6;
    --series-1-fill: rgba(42, 120, 214, 0.08);
    --series-2: #eb6834;
    --up: #0ca30c;
    --up-ink: #0a6e0a;
    --down: #d03b3b;
    --down-ink: #b02a2a;
    --warn: #fab219;
    --warn-ink: #7d5000;
    --shadow: 0 1px 2px rgba(17, 21, 33, 0.06), 0 4px 16px rgba(17, 21, 33, 0.05);
    --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1016;
      --surface: #151922;
      --surface-2: #1b202b;
      --ink: #e8ebf2;
      --ink-2: #aab1c2;
      --ink-3: #848c9f;
      --rule: #272e3c;
      --grid: #212735;
      --accent: #f0a33a;
      --accent-ink: #f5b660;
      --fan-95: rgba(240, 163, 58, 0.15);
      --fan-68: rgba(240, 163, 58, 0.32);
      --series-1: #3987e5;
      --series-1-fill: rgba(57, 135, 229, 0.10);
      --series-2: #d95926;
      --up-ink: #4cc94c;
      --down-ink: #ef7a7a;
      --warn-ink: #fab219;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1016;
    --surface: #151922;
    --surface-2: #1b202b;
    --ink: #e8ebf2;
    --ink-2: #aab1c2;
    --ink-3: #848c9f;
    --rule: #272e3c;
    --grid: #212735;
    --accent: #f0a33a;
    --accent-ink: #f5b660;
    --fan-95: rgba(240, 163, 58, 0.15);
    --fan-68: rgba(240, 163, 58, 0.32);
    --series-1: #3987e5;
    --series-1-fill: rgba(57, 135, 229, 0.10);
    --series-2: #d95926;
    --up-ink: #4cc94c;
    --down-ink: #ef7a7a;
    --warn-ink: #fab219;
    --shadow: none;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 56px;
    display: grid;
    gap: 28px;
  }
  @media (min-width: 720px) { .wrap { padding-inline: 28px; } }

  h1, h2, h3 { text-wrap: balance; margin: 0; }
  h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.01em;
  }
  p { margin: 0; }
  .eyebrow {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .section { display: grid; gap: 14px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .section-head p { color: var(--ink-3); font-size: 13.5px; max-width: 62ch; }

  /* Header */
  .masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 5vw, 40px);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .masthead h1 .quote { color: var(--ink-3); font-weight: 500; }
  .masthead .sub { color: var(--ink-2); margin-top: 8px; }
  .stamp { text-align: right; font-size: 12.5px; color: var(--ink-3); display: grid; gap: 2px; }
  @media (max-width: 560px) { .stamp { text-align: left; } }

  /* Asset switcher */
  .assets { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .asset-card {
    appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    padding: 14px 16px; display: grid; gap: 8px; box-shadow: var(--shadow);
    transition: border-color 0.15s ease;
  }
  .asset-card:hover { border-color: var(--ink-3); }
  .asset-card[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
  .asset-card:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .ac-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ac-ticker { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }
  .ac-signal { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .ac-signal.up { color: var(--up-ink); }
  .ac-signal.down { color: var(--down-ink); }
  .ac-signal.hold { color: var(--ink-2); }
  .ac-price { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .ac-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
  .ac-meta b { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ac-range { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .asset-card { transition: none; } }
  @media (max-width: 560px) {
    .assets { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
    .asset-card { padding: 10px 12px; gap: 6px; }
    .ac-top { flex-wrap: wrap; gap: 4px; }
    .ac-ticker { font-size: 16px; }
    .ac-signal { font-size: 10px; padding: 1px 6px; }
    .ac-price { font-size: 16px; }
    .ac-meta { font-size: 12px; }
    .ac-meta span + span, .ac-range { display: none; }
  }
  .detail { display: grid; gap: 28px; }
  .detail:focus { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .list-tools { display: flex; gap: 12px; }
  .list-tools input {
    flex: 1; max-width: 320px; font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px;
  }
  .list-tools input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .list-scroll { max-height: 440px; overflow: auto; }
  .assets-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .assets-table th button.sort {
    appearance: none; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .assets-table th button.sort::after { content: " ↕"; opacity: 0.45; }
  .assets-table th[aria-sort="ascending"] button.sort::after { content: " ↑"; opacity: 1; }
  .assets-table th[aria-sort="descending"] button.sort::after { content: " ↓"; opacity: 1; }
  .assets-table td:first-child { min-width: 0; }
  .assets-table tbody tr { cursor: pointer; }
  .assets-table tbody tr:hover td { background: var(--surface-2); }
  .assets-table tbody tr.is-current td { background: var(--fan-95); }
  .row-btn {
    appearance: none; font: inherit; font-family: var(--font-display); font-weight: 700; font-size: 13.5px;
    color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .row-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 3px; }
  .skipped { font-size: 13px; color: var(--ink-3); }
  .skipped summary { cursor: pointer; width: fit-content; }
  .skipped ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 2px; }
  .skipped b { color: var(--ink-2); font-weight: 600; }
  .asset-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .asset-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4.5vw, 34px); line-height: 1.1; }
  .asset-title .quote { color: var(--ink-3); font-weight: 500; }
  .asset-head .sub { color: var(--ink-2); }

  /* Verdict */
  .verdict {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .verdict > div { padding: 20px 22px; display: grid; gap: 10px; align-content: start; }
  .verdict > div + div { border-left: 1px solid var(--rule); }
  @media (max-width: 860px) {
    .verdict { grid-template-columns: 1fr; }
    .verdict > div + div { border-left: 0; border-top: 1px solid var(--rule); }
  }
  .big {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(34px, 5vw, 44px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .big.long { font-size: clamp(26px, 3.2vw, 32px); }
  .verdict > div > * { min-width: 0; }
  .gauge { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); margin-top: 6px; }
  .gauge .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
  .gauge .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: var(--ink-3); }
  .gauge-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; align-items: baseline; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em;
    padding: 8px 16px; border-radius: 999px; width: fit-content;
    border: 1.5px solid currentColor;
  }
  .pill.up { color: var(--up-ink); }
  .pill.down { color: var(--down-ink); }
  .pill.hold { color: var(--ink-2); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-2);
  }
  .chip.warn { color: var(--warn-ink); background: rgba(250, 178, 25, 0.14); }
  .chip.good { color: var(--up-ink); background: rgba(12, 163, 12, 0.12); }
  .chip.accent { color: var(--accent-ink); background: var(--fan-95); }
  .reason { font-size: 13.5px; color: var(--ink-2); max-width: 46ch; }
  .up-ink { color: var(--up-ink); }
  .down-ink { color: var(--down-ink); }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 14px;
    min-width: 0;
  }
  .two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .two > .section { grid-template-rows: auto 1fr; }
  .two .section-head { flex-direction: column; align-items: flex-start; gap: 4px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .sw.box { height: 10px; border-radius: 2px; }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-3); }
  .tip {
    position: absolute; pointer-events: none; z-index: 2;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
    padding: 8px 10px; font-size: 12.5px; line-height: 1.45; min-width: 150px;
  }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; }
  .tip .row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Model votes */
  .votes { display: grid; gap: 10px; }
  .vote { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 4px 12px; align-items: center; }
  .vote .name { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
  .vote .name small { color: var(--ink-3); font-size: 12px; font-family: var(--font-mono); }
  .vote .val { grid-row: span 2; text-align: right; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; }
  .track .bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-3); }
  .vote.total { padding-top: 10px; border-top: 1px solid var(--rule); }
  .vote.total .name { font-weight: 600; }
  .axis-note { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); padding-right: 76px; }

  /* Events */
  .ev-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
  .ev-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .ev-list time { color: var(--ink-3); font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  .sub-h { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td:first-child { font-family: var(--font-body); white-space: normal; min-width: 180px; }
  tr.hl td { font-weight: 600; background: var(--surface-2); }
  tr.hl td:first-child { padding-left: 8px; }
  .hitbar { position: relative; display: inline-block; width: 90px; height: 8px; background: var(--surface-2); border-radius: 4px; vertical-align: middle; margin-right: 8px; }
  .hitbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--series-1); }
  .hitbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .tag-now { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--accent-ink); margin-left: 6px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
  .kpi .label { font-size: 12px; color: var(--ink-3); }
  .kpi .value { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .kpi .note { font-size: 12px; color: var(--ink-3); }

  footer { font-size: 13px; color: var(--ink-3); display: grid; gap: 8px; max-width: 80ch; }
  footer strong { color: var(--ink-2); font-weight: 600; }
  code { font-family: var(--font-mono); font-size: 0.92em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .empty { padding: 40px 0; color: var(--ink-2); }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  var DATA = /*__BOT_DATA__*/null;
  var app = document.getElementById("app");
  var ASSETS = DATA ? (DATA.assets || [DATA]) : [];
  if (!ASSETS.length) {
    app.innerHTML = '<p class="empty">Няма данни. Генерирай отчета с <code>python -m crypto_bot predict --html reports/dashboard.html</code>.</p>';
    return;
  }
  var BAR = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "6h": 21600, "1d": 86400 };
  var SVGNS = "http://www.w3.org/2000/svg";

  function nf(d) { return new Intl.NumberFormat("bg-BG", { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function usd(v, d) {
    if (v == null || isNaN(v)) return "—";
    if (d == null) {
      // Same rule as report._price: about four significant digits below $1, so meme coins
      // priced in millionths do not collapse to "$0,00".
      var a = Math.abs(v);
      d = a >= 1000 ? 0 : a >= 1 || a === 0 ? 2 : Math.min(12, Math.max(2, 3 - Math.floor(Math.log10(a))));
    }
    return "$" + nf(d).format(v);
  }
  function pct(v, d, sign) {
    if (v == null || isNaN(v)) return "—";
    if (d == null) d = 1;
    var s = v < 0 ? "−" : (sign && v > 0 ? "+" : "");
    return s + nf(d).format(Math.abs(v) * 100) + "%";
  }
  function dateFormats(granularity) {
    var barMs = (BAR[granularity] || 86400) * 1000, intraday = barMs < 86400000;
    var full = new Intl.DateTimeFormat("bg-BG", intraday
      ? { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }
      : { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
    var axis = new Intl.DateTimeFormat("bg-BG", intraday
      ? { day: "2-digit", month: "2-digit", hour: "2-digit", timeZone: "UTC" }
      : { day: "numeric", month: "short", timeZone: "UTC" });
    return { barMs: barMs, full: function (t) { return full.format(new Date(t)); }, axis: axis };
  }
  function ticker(product) { return String(product).split("-")[0]; }
  var GRAN_TEXT = { "1m": "1-минутни", "5m": "5-минутни", "15m": "15-минутни", "1h": "часови", "6h": "6-часови", "1d": "дневни" };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function niceTicks(min, max, count) {
    var span = max - min || Math.abs(max) || 1;
    var step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), norm = step0 / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var out = [];
    for (var v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  }
  var SIGNAL = {
    BUY: { cls: "up", icon: "▲", text: "КУПИ" },
    SELL: { cls: "down", icon: "▼", text: "ПРОДАЙ" },
    HOLD: { cls: "hold", icon: "■", text: "ИЗЧАКАЙ" }
  };
  function renderAsset(D, root) {
  var P = D.prediction, M = D.meta, BT = D.backtest;
  var DF = dateFormats(M.granularity), barMs = DF.barMs, dAxis = DF.axis, fdate = DF.full;
  var horizonText = M.horizon === 1 ? "1 период напред" : M.horizon + " периода напред";

  var expChange = Math.expm1(P.exp_return);
  var expPrice = usd(P.expected_price);
  var sig = SIGNAL[P.signal] || SIGNAL.HOLD;
  var edgeChip = P.has_edge === true
    ? '<span class="chip good">✓ Доказано предимство в бектеста</span>'
    : P.has_edge === false
      ? '<span class="chip warn">⚠ Без доказано предимство в бектеста</span>'
      : '<span class="chip">Бектестът е изключен</span>';
  var up = P.prob_up >= 0.5;

        tip.innerHTML = "<b>" + fdate(p.t) + "</b>" +
          '<div class="row"><span>Затваряне</span><span>' + usd(p.c) + "</span></div>" +
          (prev ? '<div class="row"><span>Промяна</span><span>' + pct(p.c / prev.c - 1, 2, true) + "</span></div>" : "");
        px = x(p.t);
      }
      cross.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
      tip.hidden = false;
      placeTip(tip, box, px * (r.width / W), (parseFloat(dot.getAttribute("cy"))) * (r.height / H));
    }
    function leave() { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; }
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", leave);
  }

  function drawEquity() {
    var box = document.getElementById("equity-chart");
    if (!box || !BT) return;
    box.innerHTML = "";
    var W = Math.max(300, box.clientWidth), H = W < 560 ? 220 : 260;
    var m = { t: 12, r: 64, b: 30, l: 4 };
    var pts = BT.equity.map(function (d) { return { t: Date.parse(d.t), s: d.s - 1, b: d.b - 1 }; });
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    var vals = pts.map(function (p) { return p.s; }).concat(pts.map(function (p) { return p.b; }), [0]);
    var ymin = Math.min.apply(null, vals), ymax = Math.max.apply(null, vals);
    var pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
    function x(t) { return m.l + (t - t0) / (t1 - t0) * pw; }
    function y(v) { return m.t + (1 - (v - ymin) / (ymax - ymin)) * ph; }
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", "aria-label": "Доходност на стратегията спрямо купи и дръж" });
    niceTicks(ymin, ymax, 4).forEach(function (v) {
      el("line", { x1: m.l, x2: m.l + pw, y1: y(v), y2: y(v), stroke: Math.abs(v) < 1e-9 ? "var(--ink-3)" : "var(--grid)", "stroke-width": 1 }, svg);
      var tx = el("text", { x: m.l + 2, y: y(v) - 5 }, svg); tx.textContent = pct(v, 0, true);
    });
    var nX = W < 560 ? 3 : 5;
    for (var k = 0; k < nX; k++) {
      var idx = Math.round(k * (pts.length - 1) / nX);
      var tt = el("text", { x: x(pts[idx].t), y: H - 8, "text-anchor": k === 0 ? "start" : "middle" }, svg);
      tt.textContent = dAxis.format(new Date(pts[idx].t));
    }
    function line(key) { return pts.map(function (p, i) { return (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p[key]).toFixed(1); }).join(" "); }
    el("path", { d: line("b"), fill: "none", stroke: "var(--series-2)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    el("path", { d: line("s"), fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    var endS = pts[pts.length - 1];
    var ys = y(endS.s), yb = y(endS.b);
    if (Math.abs(ys - yb) < 16) { var mid = (ys + yb) / 2, dir = ys <= yb ? -1 : 1; ys = mid + dir * 8; yb = mid - dir * 8; }
    [["s", "var(--series-1)", ys, "стратегия"], ["b", "var(--series-2)", yb, "купи и дръж"]].forEach(function (d) {
      el("circle", { cx: x(endS.t), cy: y(endS[d[0]]), r: 4, fill: d[1], stroke: "var(--surface)", "stroke-width": 2 }, svg);
    });
    var cross = el("line", { y1: m.t, y2: m.t + ph, stroke: "var(--ink-3)", "stroke-width": 1, "stroke-dasharray": "2 3", visibility: "hidden" }, svg);
    var hit = el("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "transparent", style: "cursor:crosshair" }, svg);
    box.appendChild(svg);
    var tip = tooltip(box);
    function move(evt) {
      var r = svg.getBoundingClientRect();
      var px = (evt.clientX - r.left) * (W / r.width);
      var best = 0, bd = Infinity;
      pts.forEach(function (p, i) { var dd = Math.abs(x(p.t) - px); if (dd < bd) { bd = dd; best = i; } });
      var p = pts[best];
      cross.setAttribute("x1", x(p.t)); cross.setAttribute("x2", x(p.t)); cross.setAttribute("visibility", "visible");
      tip.innerHTML = "<b>" + fdate(p.t) + "</b>" +
        '<div class="row"><span><i class="sw" style="background:var(--series-1)"></i> Стратегия</span><span>' + pct(p.s, 1, true) + "</span></div>" +
        '<div class="row"><span><i class="sw" style="background:var(--series-2)"></i> Купи и дръж</span><span>' + pct(p.b, 1, true) + "</span></div>";
      tip.hidden = false;
      placeTip(tip, box, x(p.t) * (r.width / W), Math.min(y(p.s), y(p.b)) * (r.height / H));
    }
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", function () { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
    // direct end labels in the right margin, drawn after the tooltip layer so they stay readable
    [["var(--series-1)", ys, pct(endS.s, 1, true)], ["var(--series-2)", yb, pct(endS.b, 1, true)]].forEach(function (d) {
      var t = el("text", { x: x(endS.t) + 10, y: d[1] + 4, style: "font-weight:500;fill:var(--ink-2)" }, svg);
      t.textContent = d[2];
    });
  }

  function drawAll() { drawPrice(); drawEquity(); }
  drawAll();
  return drawAll;
  }

  // ---------- shell: one card per asset, detail of the selected one ----------
  var first = ASSETS[0], F = dateFormats(first.meta.granularity);
  var SKIPPED = (DATA && DATA.skipped) || [];
  var MANY = ASSETS.length > 4;
  var shell = '<header class="masthead"><div>' +
    '<div class="eyebrow">Крипто прогнозен бот</div>' +
    '<h1>Прогноза за ' + F.full(Date.parse(first.prediction.target_close_time) - F.barMs) + '</h1>' +
    '<p class="sub">' + esc(GRAN_TEXT[first.meta.granularity] || first.meta.granularity) + ' свещи · ' +
      (MANY ? ASSETS.length + ' актива' : ASSETS.map(function (a) { return esc(ticker(a.meta.product)); }).join(", ")) +
      ' · данни от Coinbase</p>' +
    '</div><div class="stamp">' +
    '<span>Последна затворена свещ: <b class="num">' + F.full(Date.parse(first.prediction.as_of)) + '</b></span>' +
    '<span>Прогнозата е за затварянето: <b class="num">' + F.full(Date.parse(first.prediction.target_close_time)) + ' UTC</b></span>' +
    '</div></header>';
  if (ASSETS.length > 1 && !MANY) {
    shell += '<div class="assets" role="tablist" aria-label="Активи">' + ASSETS.map(function (a, i) {
      var p = a.prediction, s = SIGNAL[p.signal] || SIGNAL.HOLD, upA = p.prob_up >= 0.5;
      return '<button type="button" class="asset-card" role="tab" id="tab-' + i + '" aria-controls="detail" data-i="' + i + '">' +
        '<span class="ac-top"><span class="ac-ticker">' + esc(ticker(a.meta.product)) + '</span>' +
          '<span class="ac-signal ' + s.cls + '"><span aria-hidden="true">' + s.icon + '</span> ' + s.text + '</span></span>' +
        '<span class="ac-price">' + usd(p.last_close) + '</span>' +
        '<span class="ac-meta"><span>Ръст <b class="' + (upA ? "up-ink" : "down-ink") + '">' + pct(p.prob_up) + '</b></span>' +
          '<span>очаквано <b class="' + (p.exp_return >= 0 ? "up-ink" : "down-ink") + '">' + pct(Math.expm1(p.exp_return), 2, true) + '</b></span></span>' +
        '<span class="ac-range">68%: ' + usd(p.range_68[0]) + ' – ' + usd(p.range_68[1]) + '</span>' +
        '</button>';
    }).join("") + '</div>';
  }
  if (MANY) {
    var withEdge = ASSETS.filter(function (a) { return a.prediction.has_edge; }).length;
    shell += '<section class="section" aria-label="Всички активи"><div class="section-head"><h2>Всички активи</h2>' +
      '<p>' + ASSETS.length + ' прогнози, ' + withEdge + ' с доказано предимство в бектеста. Избери ред за подробности; заглавията сортират.</p></div>' +
      '<div class="panel"><div class="list-tools"><label class="sr-only" for="asset-filter">Търси актив</label>' +
      '<input type="search" id="asset-filter" placeholder="Търси актив, напр. DOGE" autocomplete="off"></div>' +
      '<div class="table-wrap list-scroll"><table class="assets-table"><thead><tr>' +
      [["ticker", "Актив"], ["price", "Цена"], ["prob", "Ръст"], ["exp", "Очаквано"], ["vol", "σ"], [null, "Коридор 68%"], [null, "Сигнал"]]
        .map(function (c) {
          return c[0] ? '<th aria-sort="none"><button type="button" class="sort" data-key="' + c[0] + '">' + c[1] + '</button></th>' : '<th>' + c[1] + '</th>';
        }).join("") +
      '</tr></thead><tbody id="asset-rows"></tbody></table></div>' +
      '<p class="muted" id="asset-empty" hidden>Няма актив с това име.</p></div></section>';
  }
  if (SKIPPED.length) {
    shell += '<details class="skipped"><summary>Пропуснати активи (' + SKIPPED.length + ')</summary><ul>' +
      SKIPPED.map(function (s) { return '<li><b>' + esc(ticker(s.product)) + '</b> ' + esc(s.reason) + '</li>'; }).join("") +
      '</ul></details>';
  }
  shell += '<div class="detail" id="detail"' + (ASSETS.length > 1 && !MANY ? ' role="tabpanel"' : "") + ' tabindex="-1"></div>';
  app.innerHTML = shell;

  var detail = document.getElementById("detail");
  var tabs = Array.prototype.slice.call(app.querySelectorAll(".asset-card"));
  var redraw = function () {};
  var current = 0;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function select(i, opts) {
    opts = opts || {};
    current = i;
    tabs.forEach(function (t, j) {
      t.setAttribute("aria-selected", j === i ? "true" : "false");
      t.tabIndex = j === i ? 0 : -1;
    });
    if (tabs[i]) {
      detail.setAttribute("aria-labelledby", tabs[i].id);
      if (opts.focus) tabs[i].focus();
    }
    if (MANY) renderRows();
    redraw = renderAsset(ASSETS[i], detail);
    if (ASSETS.length > 1) {
      try { history.replaceState(null, "", "#" + ticker(ASSETS[i].meta.product).toLowerCase()); } catch (e) { /* sandboxed */ }
    }
    if (opts.scroll && detail.getBoundingClientRect().top > window.innerHeight * 0.6) {
      detail.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    }
  }
  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { select(i); });
    t.addEventListener("keydown", function (e) {
      var k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (k) { e.preventDefault(); select((i + k + tabs.length) % tabs.length, { focus: true }); }
    });
  });

  // Overview table for many assets: filter + sort, a row selects the detail view.
  var sortKey = null, sortDir = -1, filterText = "";
  function sortValue(a, key) {
    var p = a.prediction;
    return key === "ticker" ? ticker(a.meta.product) : key === "price" ? p.last_close : key === "prob" ? p.prob_up
      : key === "exp" ? p.exp_return : p.sigma;
  }
  function renderRows() {
    var body = document.getElementById("asset-rows");
    if (!body) return;
    var idx = ASSETS.map(function (a, i) { return i; }).filter(function (i) {
      return !filterText || ticker(ASSETS[i].meta.product).toLowerCase().indexOf(filterText) !== -1;
    });
    if (sortKey) {
      idx.sort(function (x, y) {
        var a = sortValue(ASSETS[x], sortKey), b = sortValue(ASSETS[y], sortKey);
        return (a < b ? -1 : a > b ? 1 : 0) * sortDir;
      });
    }
    body.innerHTML = idx.map(function (i) {
      var a = ASSETS[i], p = a.prediction, s = SIGNAL[p.signal] || SIGNAL.HOLD, upA = p.prob_up >= 0.5, chg = Math.expm1(p.exp_return);
      return '<tr data-i="' + i + '"' + (i === current ? ' class="is-current"' : "") + '>' +
        '<td><button type="button" class="row-btn" data-i="' + i + '"' + (i === current ? ' aria-current="true"' : "") + '>' + esc(ticker(a.meta.product)) + '</button>' +
          (p.has_edge ? ' <span class="tag-now">предимство</span>' : "") + '</td>' +
        '<td>' + usd(p.last_close) + '</td>' +
        '<td class="' + (upA ? "up-ink" : "down-ink") + '">' + (upA ? "▲ " : "▼ ") + pct(p.prob_up) + '</td>' +
        '<td class="' + (chg >= 0 ? "up-ink" : "down-ink") + '">' + pct(chg, 2, true) + '</td>' +
        '<td>' + pct(p.sigma, 1) + '</td>' +
        '<td>' + usd(p.range_68[0]) + ' – ' + usd(p.range_68[1]) + '</td>' +
        '<td><span class="ac-signal ' + s.cls + '"><span aria-hidden="true">' + s.icon + '</span> ' + s.text + '</span></td></tr>';
    }).join("");
    document.getElementById("asset-empty").hidden = idx.length > 0;
  }
  if (MANY) {
    var rowsEl = document.getElementById("asset-rows");
    rowsEl.addEventListener("click", function (e) {
      var tr = e.target.closest("tr[data-i]");
      if (tr) select(+tr.getAttribute("data-i"), { scroll: true });
    });
    document.getElementById("asset-filter").addEventListener("input", function (e) {
      filterText = e.target.value.trim().toLowerCase();
      renderRows();
    });
    Array.prototype.forEach.call(app.querySelectorAll("button.sort"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-key");
        sortDir = sortKey === key ? -sortDir : (key === "ticker" ? 1 : -1);
        sortKey = key;
        Array.prototype.forEach.call(app.querySelectorAll("th[aria-sort]"), function (th) { th.setAttribute("aria-sort", "none"); });
        b.parentNode.setAttribute("aria-sort", sortDir > 0 ? "ascending" : "descending");
        renderRows();
      });
    });
  }

  var wanted = (location.hash || "").replace("#", "").toLowerCase(), start = 0;
  ASSETS.forEach(function (a, i) { if (ticker(a.meta.product).toLowerCase() === wanted) start = i; });
  select(start);

  var lastW = app.clientWidth, raf = 0;
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (app.clientWidth === lastW) return;
      lastW = app.clientWidth;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () { redraw(); });
    }).observe(app);
  }
})();
</script>
