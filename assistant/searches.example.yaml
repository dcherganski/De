# Запазени търсения за listings-scout.
# Копирай като assistant/data/searches.yaml и редактирай.
searches:
  - name: apartament-sofia
    what: двустаен апартамент под наем
    where: София, Лозенец / Изток / Център
    budget_max_eur: 900
    must: [обзаведен, до 15 мин пеша от метро]
    nice: [тераса, паркомясто]
    schedule: daily
  - name: kola
    what: Toyota Corolla или Mazda 3, бензин/хибрид
    where: цялата страна
    budget_max_eur: 12000
    must: [след 2016, до 150 000 км]
    nice: [автоматик]
    schedule: daily
